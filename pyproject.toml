[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagbot"
version = "0.1.3"
description = "The first self-funding, self-healing AI daemon for agents on Orbio — claim, watch, top-up, and rotate OpenRouter keys automatically. Chinese notifications built in."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "keyneszeng" }]
keywords = ["orbio", "openrouter", "ai-agent", "mcp", "daemon", "self-funding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "tzdata>=2024.1",
]

[project.scripts]
bagbot = "bagbot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.urls]
"Source" = "https://github.com/keyneszeng/bagbot"
"Issues" = "https://github.com/keyneszeng/bagbot/issues"
"Orbio Build Week" = "https://orbio.so/build"

# ─── Setuptools: src layout ────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# ─── Pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ─── Ruff ──────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "data", ".test-venv"]

[tool.ruff.lint]
# We follow a "bugbear + security + pyupgrade + comprehensions" baseline.
# We deliberately leave style rules (E, W) off so the codebase can
# grow without bikeshedding.
select = [
    "F",      # pyflakes (real bugs)
    "B",      # bugbear (likely bugs)
    "S",      # bandit (security)
    "UP",     # pyupgrade (use modern syntax)
    "C4",     # comprehensions
    "PIE",    # flake8-pie
    "RET",    # return statement
    "SIM",    # simplify
    "TID",    # tidy imports
    "ARG",    # unused arguments
    "PTH",    # use pathlib
    "ERA",    # eradicate commented-out code
]
ignore = [
    "S101",   # Use of `assert` detected — we use asserts in tests
    "B008",   # Function call in default argument — FastAPI Depends() uses this
    "S104",   # Possible binding to all interfaces — daemon binds 0.0.0.0 sometimes
    "S105",   # Possible hard-coded password — these are placeholders
    "S106",   # Possible hard-coded password
    "S311",   # Standard pseudo-random generators — non-crypto use is fine
    "ARG001", # Unused function argument — overrides / interface stubs
    "ARG002", # Unused method argument
    "SIM105", # Use contextlib.suppress — context manager is more readable
    "SIM108", # Use ternary — explicit if-else is clearer here
    "PTH123", # open() vs Path — open is fine for our use
    "UP006",   # keep Union[str, ...] style for backwards compat
    "UP007",   # keep Optional[str] style for backwards compat
    "ERA001",  # commented-out code in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S",     # security in tests
    "B",     # bugbear in tests (asserts are common)
    "ARG",   # pytest fixtures use *args/**kwargs
    "PTH",   # tests can use os.path
    "SIM",   # tests don't need to be terse
    "RET",
    "ERA",
]
"scripts/**/*.py" = [
    "T201",  # print() in scripts is fine
    "PTH",   # scripts can use shell-style paths
    "S",
    "B",
]

# ─── MyPy ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
disallow_incomplete_defs = false    # we use **kwargs and dynamic args
disallow_untyped_decorators = false
disable_error_code = [
    "no-untyped-call",     # pydantic + aiosqlite + httpx are untyped
    "no-untyped-def",      # we have many untyped helpers
    "var-annotated",       # we don't annotate all locals
    "attr-defined",        # forward references in dataclass-heavy code
]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
ignore_errors = true
