name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-xdist httpx fastapi aiosqlite
          # Pin lint tools to match the version tested locally.
          pip install 'ruff==0.16.6'

      - name: Byte-compile (syntax check)
        run: |
          python -m compileall -q src/

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Run tests (parallel)
        run: |
          python -m pytest tests/ -n auto --timeout=120

  lint-sh:
    name: Shellcheck install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          # Note: 'additional_files' is for paths at the repo root.  Our
          # install scripts live in ./scripts/ and are picked up by
          # 'scandir' above, so no additional_files are needed.
          # Only fail on real errors, not style warnings.
          fail_threshold: error
