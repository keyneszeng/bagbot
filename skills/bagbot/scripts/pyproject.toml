[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bagbot-skill"
version = "0.1.2"
description = "Self-funding AI daemon skill — Orbio MCP 6 tools + policy facade for any agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
full = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
]

[tool.setuptools]
py-modules = [
    "bagbot_bootstrap",
    "bagbot_orbio",
    "bagbot_policy",
    "bagbot_settings",
    "bagbot_cli",
]
